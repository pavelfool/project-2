
<div class="major">
  <div class="title">
    <h2>Angular users task</h2>
  </div>

  <div class="block1">
    <div class="fromBlock1">

      <div class="firstBox">

        <div id="login1">
          <h4 id="loginText">Login</h4>
          <input type="text" id="login1-input" placeholder="Enter login">
        </div>

        <div id="password1">
          <h4 id="passwordText">Password</h4>
          <input type="password" id="password1-input" placeholder="Enter password">
        </div>

        <div id="email1">
          <h4 id="emailText">Email address</h4>
          <input type="email" id="email1-input" placeholder="Enter email">
        </div>

        <div id="enter">
          <button id="enterButton" (click)="addUser()">Add user</button>
        </div>

      </div>

      <div class="secondBox">

        <div id="titleLPEED">
          <h4 id="titleLPEEDText">
            <span>#</span>
            <span>Login</span>
            <span>Password</span>
            <span>Email</span>
            <span>Edit</span>
            <span>Delete</span>
          </h4>
        </div>

        <hr id="hr1">

        <div id="ED">

          @for (user of arrUser1; track user; let i = $index) {
            <div class="user-row">
              <span>{{ i + 1 }}</span>
              <span>{{ user.login }}</span>
              <span>{{ user.password }}</span>
              <span>{{ user.email }}</span>

              <button class="editButton" (click)="editUser(i)">Edit</button>
              <button class="deleteButton" (click)="deleteUser(i)">Delete</button>
            </div>
          }

        </div>

      </div>

    </div>
  </div>
</div>
